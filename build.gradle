// Controller script for the Stonecutter build.
//
// Per-node configuration lives in the split build scripts, which Stonecutter assigns in
// settings.gradle:
//   - build.fabric.gradle   -> the Fabric nodes (`26.2`, `26.1.2`, `1.21.11`)
//   - build.neoforge.gradle -> the NeoForge nodes (`26.2-neoforge`, ...)
//
// Shared sources (`src/main`, `src/client`) are loader-agnostic; all loader coupling lives in
// `dev.vfxweaver.platform` behind Stonecutter `//? if fabric` / `//? if neoforge` guards.
