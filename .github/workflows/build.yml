# Build the project and run any configured tests for every push and pull
# request; publish a GitHub release with the built jar on version tags.

name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: "26.2"
            java: "25"
          - node: "26.2-neoforge"
            java: "25"
          - node: "26.1.2"
            java: "25"
          - node: "26.1.2-neoforge"
            java: "25"
          - node: "1.21.11"
            java: "21"
          - node: "1.21.11-neoforge"
            java: "21"
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build ${{ matrix.node }}
        run: ./gradlew :${{ matrix.node }}:build
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts-${{ matrix.node }}
          path: versions/${{ matrix.node }}/build/libs/

  release:
    # publish only on version tags, e.g. v1.0.0
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: download build artifacts
        uses: actions/download-artifact@v7
        with:
          path: build/libs
          merge-multiple: true
      - name: publish release
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          generate_release_notes: true