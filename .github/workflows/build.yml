# Build the project and run any configured tests for every push and pull
# request; publish a GitHub release with the built jar on version tags.

name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: "26.2"
            java: "25"
          - node: "26.2-neoforge"
            java: "25"
          - node: "26.1.2"
            java: "25"
          - node: "26.1.2-neoforge"
            java: "25"
          - node: "1.21.11"
            java: "21"
          - node: "1.21.11-neoforge"
            java: "21"
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      # stonecutter.gradle is git-ignored (it is a per-developer choice of which node's comment
      # form is on disk). Without it Stonecutter cannot transform the committed 26.1.2 source for
      # the other nodes. Declare the on-disk base so every node's guarded source is materialised
      # correctly; this is the same content a developer has locally (see AGENTS.md, Multi-version).
      - name: activate stonecutter version
        run: |
          printf 'plugins {\n\tid "dev.kikugie.stonecutter"\n}\nstonecutter.active "26.1.2"\n' > stonecutter.gradle
          cat stonecutter.gradle
      # Retry the whole build so a transient Maven Central 429 / network flake does not fail the
      # job. No extra Gradle plugins; the retry only re-runs the already-configured build.
      - name: build ${{ matrix.node }}
        run: |
          for attempt in 1 2 3; do
            if ./gradlew :${{ matrix.node }}:build --console=plain; then
              exit 0
            fi
            echo "::warning::build ${{ matrix.node }} attempt $attempt failed; retrying in 20s"
            sleep 20
          done
          exit 1
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts-${{ matrix.node }}
          path: versions/${{ matrix.node }}/build/libs/

  release:
    # publish only on version tags, e.g. v1.0.0
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: download build artifacts
        uses: actions/download-artifact@v7
        with:
          path: build/libs
          merge-multiple: true
      - name: publish release
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          generate_release_notes: true