pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		maven {
			name = 'NeoForged'
			url = 'https://maven.neoforged.net/releases/'
		}
		maven {
			name = 'KikuGie Releases'
			url = 'https://maven.kikugie.dev/releases'
		}
		maven {
			name = 'KikuGie Snapshots'
			url = 'https://maven.kikugie.dev/snapshots'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

plugins {
	id 'dev.kikugie.stonecutter' version '0.9.8'
}

stonecutter {
	// Use the Groovy DSL; Stonecutter defaults to a Kotlin controller.
	kotlinController = false
	centralScript = 'build.gradle'

	create(getRootProject()) {
		// One node per (Minecraft version, loader). The Fabric nodes keep their historical names so
		// `:26.2:build` and the released jar names stay valid. Loader-specific build logic lives in
		// split build scripts (the upstream-recommended multi-loader setup); the second map entry is
		// the logical version used by `//? if >=26.2` comment conditions.
		versions(['26.2': '26.2']).buildscript 'build.fabric.gradle'
		versions(['26.1.2': '26.1.2']).buildscript 'build.fabric.gradle'
		versions(['1.21.11': '1.21.11']).buildscript 'build.fabric.gradle'
		versions(['26.2-neoforge': '26.2']).buildscript 'build.neoforge.gradle'
	}
}

rootProject.name = 'vfxweaver'
