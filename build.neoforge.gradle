plugins {
	id 'java-library'
	id 'net.neoforged.moddev' version '2.0.147'
}

// Stonecutter constant: which loader this node targets, so shared sources can branch with
// `//? if fabric { ... //?} else { ... //?}`. Both constants are declared on every node so a
// condition never references an unknown name.
stonecutter {
	constants['fabric'] = false
	constants['neoforge'] = true
}

version = "${property('mod_version')}+${sc.current.project}"
base.archivesName = property('mod_id').toString()

def minecraftVersion = property('deps.minecraft')
def javaVersion = (property('deps.java') as String).toInteger()

// NeoForge has no environment-splitting source sets, so the client half of the shared tree is
// compiled into its own source set (the same split Loom's splitEnvironmentSourceSets gives the
// Fabric nodes) and both source sets are registered on the mod below.
// The client source set only has to exist: Stonecutter owns its source directories and materialises
// the generated 26.2 text under build/generated/stonecutter/client. Adding the raw src/client here
// would duplicate the classes with the active-node (26.1.2) text.
sourceSets {
	client {
		compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
		runtimeClasspath += sourceSets.main.output
	}
}

neoForge {
	version = property('deps.neo_loader')
	validateAccessTransformers = true
	// Applied to the Minecraft artifacts at NFRT time so the widened members are visible while
	// compiling; the AT file itself ships in the jar and is declared in neoforge.mods.toml.
	accessTransformers.from rootProject.file('src/main/resources/META-INF/accesstransformer.cfg')

	mods {
		register(property('mod_id').toString()) {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		client {
			client()
			sourceSet = sourceSets.client
		}
		server {
			server()
			programArgument '--nogui'
		}
	}
}

def expandProps = [
		version           : project.version,
		minecraft         : minecraftVersion,
		java              : javaVersion,
		compatibilityLevel: "JAVA_${javaVersion}",
		neoCompat         : property('deps.mc_compat'),
		loaderCompat      : property('deps.loader_compat'),
]

tasks.matching { it.name in ['processResources', 'processClientResources'] }.configureEach {
	inputs.properties(expandProps)
	filesMatching('META-INF/neoforge.mods.toml') { expand(expandProps) }
	filesMatching('*.mixins.json') { expand(expandProps) }
	// The Fabric metadata and access wideners must not end up in the NeoForge jar.
	exclude 'fabric.mod.json'
	exclude 'vfxweaver.accesswidener'
	exclude 'vfxweaver-named.accesswidener'
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = javaVersion
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.toVersion(javaVersion)
	targetCompatibility = JavaVersion.toVersion(javaVersion)
}

// Loom packages the client source set for us on the Fabric side; ModDevGradle does not.
jar {
	from sourceSets.client.output
}

tasks.named('createMinecraftArtifacts') {
	dependsOn 'stonecutterGenerate'
}
