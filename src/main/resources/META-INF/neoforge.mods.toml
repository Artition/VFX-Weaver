license="MIT"

[[mods]]
modId="vfxweaver"
version="${version}"
displayName="VFX Weaver API"
logoFile="assets/vfxweaver/icon.png"
authors="Artition"
description='''
A client-side VFX library/API for Minecraft: ping-pong FBO post-processing (chromatic aberration, color grading, distortion, dent, gradient map, posterize, blur, pixelate, hue isolation, vignette, screen flash, motion blur, speed lines), camera shake, block tint/outline overlays, entity tint/outline by UUID, keyframe animation, world/camera/player bindings, datapack-defined effects, sound triggers and a public Java API.
'''

[[mixins]]
config="vfxweaver.mixins.json"

[[mixins]]
config="vfxweaver.client.mixins.json"

[[accessTransformers]]
file="META-INF/accesstransformer.cfg"

[[dependencies.vfxweaver]]
modId="neoforge"
type="required"
versionRange="${neoCompat}"
ordering="NONE"
side="BOTH"

[[dependencies.vfxweaver]]
modId="minecraft"
type="required"
versionRange="${mcCompat}"
ordering="NONE"
side="BOTH"

[[dependencies.vfxweaver]]
modId="flashback"
type="optional"
versionRange="*"
ordering="NONE"
side="CLIENT"

[[dependencies.vfxweaver]]
modId="iris"
type="optional"
versionRange="*"
ordering="NONE"
side="CLIENT"
