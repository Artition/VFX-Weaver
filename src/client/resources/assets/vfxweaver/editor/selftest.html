<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VFXweaver compiler selftest</title>
<!--
  Dev-only self-test for ir.js + compiler.js (Task 13). Not linked from the editor UI.

  Serve it from the running game bridge at `/assets/selftest.html?token=...` (the token is
  required for every request, scripts included, so the bootstrap below appends it). The
  fixtures assert the exact JSON `compileTab` emits for: a constant param, a time->curve value
  graph, an empty graph with defaults only, and an unknown effect type (which must still compile).
  The authoritative validator remains the game's `VFXDefinition.parse`; this page is the fast check.
-->
<style>
	body { background: #1c1c1c; color: #d6d6d6; font: 13px/1.5 monospace; margin: 24px; }
	pre { white-space: pre-wrap; }
	.pass { color: #6dd36d; }
	.fail { color: #ff6b6b; }
</style>
</head>
<body>
<h1>VFXweaver compiler selftest</h1>
<pre id="vfx-selftest-out">running…</pre>

<script>
/* SELFTEST:START */
/*
 * Fixtures + assertions. Runs in the browser (the bootstrap below loads ir.js/compiler.js first)
 * and is extracted and re-run headlessly by the verification harness, so it must not touch the
 * DOM. Returns an array of `{ name, ok, error? }` results.
 */
window.__vfxSelftest = function () {
	"use strict";

	var VFXIR = window.VFXIR;
	var compileTab = window.VFXCompiler && window.VFXCompiler.compileTab;
	if (!VFXIR || typeof compileTab !== "function") {
		throw new Error("VFXIR/VFXCompiler not loaded");
	}

	var results = [];

	function fail(message) {
		throw new Error(message);
	}

	function ok(condition, message) {
		if (!condition) {
			fail(message || "assertion failed");
		}
	}

	function eq(actual, expected, message) {
		if (actual !== expected) {
			fail((message || "value") + ": expected " + JSON.stringify(expected)
					+ " got " + JSON.stringify(actual));
		}
	}

	function parse(text) {
		return JSON.parse(text);
	}

	function test(name, fn) {
		try {
			fn();
			results.push({ name: name, ok: true });
		} catch (e) {
			results.push({ name: name, ok: false, error: String((e && e.message) || e) });
		}
	}

	test("(a) blur with a constant radius", function () {
		var tab = new VFXIR.Tab("blur", "blur");
		tab.params.radius = VFXIR.ParamSpec.constant(4);
		var json = compileTab(tab);
		ok(json.indexOf('"type": "blur"') >= 0, "missing '\"type\": \"blur\"'");
		ok(json.indexOf('"radius": 4') >= 0, "missing '\"radius\": 4'");
		var def = parse(json);
		eq(def.type, "blur", "type");
		eq(def.params.radius, 4, "params.radius");
		ok(!("graph" in def), "a constant tab must not emit a graph block");
	});

	test("(b) time -> curve drives radius", function () {
		var tab = new VFXIR.Tab("blur", "blur");
		tab.duration = 120;
		tab.params.radius = VFXIR.ParamSpec.constant(2);
		tab.valueNodes = [
			{ id: "phase", kind: "time", inputs: { speed: 0.25 }, pos: [40, 60] },
			{ id: "pulse", kind: "curve", pos: [200, 60], inputs: { points: [
				{ time: 0, value: 0 },
				{ time: 50, value: 8 },
				{ time: 100, value: 0 }
			] } }
		];
		tab.edges = [
			{ from: "phase", to: "pulse", input: "time" },
			{ from: "pulse", to: "radius" }
		];
		var def = parse(compileTab(tab));
		eq(def.graph.version, 1, "graph.version");
		eq(def.graph.nodes.length, 2, "graph.nodes length");
		eq(def.graph.edges.length, 1, "graph.edges length");
		eq(def.graph.edges[0].from, "phase", "graph edge from");
		eq(def.graph.edges[0].to, "pulse", "graph edge to");
		eq(def.graph.edges[0].input, "time", "graph edge input");
		eq(def.graph.meta.phase.pos[0], 40, "graph.meta position");
		eq(def.inputs.radius.from, "pulse", "inputs.radius.from");
		ok(!("pulse" in def.inputs), "a node->node edge must not land in inputs");
	});

	test("(c) empty graph with only defaults", function () {
		var tab = new VFXIR.Tab("blur", "blur");
		tab.params.radius = VFXIR.ParamSpec.constant(0);
		var def = parse(compileTab(tab));
		eq(def.type, "blur", "type");
		eq(def.duration, 40, "default duration");
		eq(def.easing, "linear", "default easing");
		eq(def.params.radius, 0, "default radius");
		ok(!("graph" in def), "no value nodes -> no graph block");
		ok(!("inputs" in def), "no value nodes -> no inputs block");
	});

	test("(d) unknown effect type still compiles", function () {
		var tab = new VFXIR.Tab("custom", "my_custom_effect");
		tab.params.strength = VFXIR.ParamSpec.expr("sin(t * 0.1)");
		tab.valueNodes = [ { id: "t", kind: "time", inputs: { speed: 1 } } ];
		tab.edges = [ { from: "t", to: "strength" } ];
		var def = parse(compileTab(tab)); // must not throw on an unknown type
		eq(def.type, "my_custom_effect", "type copied verbatim");
		eq(def.params.strength.expr, "sin(t * 0.1)", "expr param");
		eq(def.graph.nodes.length, 1, "graph survives an unknown type");
		eq(def.inputs.strength.from, "t", "inputs.strength.from");
	});

	test("(e) keyframes control reads Tab.keys", function () {
		var tab = new VFXIR.Tab("blur", "blur");
		tab.params.radius = VFXIR.ParamSpec.keyframes();
		tab.addKey("radius", 0, 0.5);
		tab.addKey("radius", 30, 1.25, "ease_out_quad");
		var def = parse(compileTab(tab));
		eq(def.params.radius.keyframes.length, 2, "keyframe count");
		eq(def.params.radius.keyframes[0].time, 0, "key[0].time");
		eq(def.params.radius.keyframes[1].value, 1.25, "key[1].value");
		eq(def.params.radius.keyframes[1].easing, "ease_out_quad", "key[1].easing");
	});

	test("(f) SnapshotHistory record/undo/redo + cap", function () {
		var history = new VFXIR.SnapshotHistory(3);
		ok(!history.canUndo(), "nothing to undo before a baseline");
		history.reset({ n: 0 });
		ok(!history.canUndo(), "baseline only -> nothing to undo");
		history.record({ n: 1 });
		history.record({ n: 2 });
		eq(history.undo().n, 1, "undo to 1");
		eq(history.undo().n, 0, "undo to 0");
		ok(!history.canUndo(), "at the baseline");
		eq(history.redo().n, 1, "redo to 1");
		// A record after an undo drops the redo branch.
		history.record({ n: 9 });
		ok(!history.canRedo(), "redo branch dropped by a new record");
		// The cap keeps the newest states only.
		history.record({ n: 10 });
		history.record({ n: 11 });
		eq(history.states.length, 3, "capped at 3 states");
		eq(history.states[history.index].n, 11, "newest state retained");
	});

	test("(g) value-wire IR: a node edge is {from,to,input}, a param wire is inputs.<name>.from", function () {
		var tab = new VFXIR.Tab("wired", "blur");
		tab.valueNodes = [
			{ id: "clock", kind: "time", inputs: { speed: 2 } },
			{ id: "sum", kind: "math", op: "add", inputs: { a: 1 } }
		];
		tab.connect("clock", "sum", "b");   // node -> node
		tab.connect("sum", "radius");       // node -> effect param
		var def = parse(compileTab(tab));
		eq(def.graph.edges.length, 1, "one node->node edge");
		eq(JSON.stringify(def.graph.edges[0]), JSON.stringify({ from: "clock", to: "sum", input: "b" }),
				"exact node->node edge shape");
		eq(def.inputs.radius.from, "sum", "node->param wire lands in inputs");
		eq(def.graph.edges[0].to, "sum", "the param wire is not duplicated into edges");
		// The wired input must not also sit in the node's `inputs` (datapack: "receives two sources").
		eq(def.graph.nodes[1].op, "add", "math op passes through");
		ok(!("b" in def.graph.nodes[1].inputs), "a wired input is excluded from node.inputs");
		eq(def.graph.nodes[1].inputs.a, 1, "an unwired literal stays on the node");
	});

	test("(h) structural fields per kind survive compile (points/expr/bind/switch)", function () {
		var tab = new VFXIR.Tab("kinds", "blur");
		tab.valueNodes = [
			{ id: "c", kind: "curve", inputs: { time: 4, points: [
				{ time: 0, value: 0 }, { time: 50, value: 3, easing: "ease_out_quad" } ] } },
			{ id: "e", kind: "expr", inputs: { expr: "sin(t * 0.1)" } },
			{ id: "b", kind: "bind", inputs: { bind: "health", fallback: 0.5 } },
			{ id: "s", kind: "switch", inputs: { index: 1, "case_0": 10, "case_1": 20, "default": 0 } },
			{ id: "n", kind: "noise", inputs: { scale: 2 } }
		];
		var byId = {};
		parse(compileTab(tab)).graph.nodes.forEach(function (node) { byId[node.id] = node; });
		eq(byId.c.inputs.points[1].value, 3, "curve points");
		eq(byId.c.inputs.points[1].easing, "ease_out_quad", "curve point easing");
		eq(byId.e.inputs.expr, "sin(t * 0.1)", "expr string");
		eq(byId.b.inputs.bind, "health", "bind kind");
		eq(byId.b.inputs.fallback, 0.5, "bind fallback");
		eq(byId.s.inputs.case_1, 20, "switch case_1");
		eq(byId.n.inputs.scale, 2, "noise scale");
	});

	test("(i) Tab.connect builds the exact wire objects the UI records", function () {
		var tab = new VFXIR.Tab("wires", "blur");
		var nodeEdge = tab.connect("a", "b", "input");
		var paramEdge = tab.connect("a", "radius");
		eq(JSON.stringify(nodeEdge), JSON.stringify({ from: "a", to: "b", input: "input" }), "node edge");
		eq(JSON.stringify(paramEdge), JSON.stringify({ from: "a", to: "radius" }), "param edge has no input");
	});

	test("(j) isFiniteNumber / parseNumber pins the hotkey default-value + inline-edit checks", function () {
		// The `K` default-value check: a descriptor default must be a real number.
		ok(VFXIR.isFiniteNumber(4), "a finite number passes");
		ok(!VFXIR.isFiniteNumber("4"), "a numeric string does not");
		ok(!VFXIR.isFiniteNumber(NaN), "NaN does not");
		ok(!VFXIR.isFiniteNumber(Infinity), "Infinity does not");
		ok(!VFXIR.isFiniteNumber(null), "null does not");
		ok(!VFXIR.isFiniteNumber(undefined), "undefined does not");
		// The inline-edit parser accepts a strict decimal only (never evaluates code).
		eq(VFXIR.parseNumber(" 2.5 "), 2.5, "decimal with padding");
		eq(VFXIR.parseNumber("-3"), -3, "negative integer");
		eq(VFXIR.parseNumber("1e2"), 100, "exponent");
		eq(VFXIR.parseNumber("alert(1)"), null, "code-ish text rejected");
		eq(VFXIR.parseNumber("1+2"), null, "arithmetic rejected (no eval)");
		eq(VFXIR.parseNumber(""), null, "empty rejected");
	});

	test("(k) clampTime pins the key time into [0, duration]", function () {
		// A key at the playhead must never land outside the lane.
		eq(VFXIR.clampTime(-5, 40), 0, "negative clamps to 0");
		eq(VFXIR.clampTime(50, 40), 40, "past the end clamps to duration");
		eq(VFXIR.clampTime(40, 40), 40, "exactly the duration is kept");
		eq(VFXIR.clampTime(12.6, 40), 12.6, "an in-range time is untouched");
		eq(VFXIR.clampTime(NaN, 40), 0, "non-finite becomes 0");
		eq(VFXIR.clampTime(7, 0), 0, "a zero duration collapses the range");
	});

	test("(l) graphToCanvas mirrors convertOffsetToCanvas for the inline-edit placement", function () {
		// (pos + offset) * scale, exactly DragAndScale.convertOffsetToCanvas.
		var at = VFXIR.graphToCanvas([5, 7], [10, 20], 2);
		eq(at[0], 30, "x = (5 + 10) * 2");
		eq(at[1], 54, "y = (7 + 20) * 2");
		var origin = VFXIR.graphToCanvas([0, 0], [0, 0], 1);
		eq(origin[0], 0, "origin x");
		eq(origin[1], 0, "origin y");
		var panned = VFXIR.graphToCanvas([-4, 3], [-6, 2], 0.5);
		eq(panned[0], -5, "negative pan x = (-4 + -6) * 0.5");
		eq(panned[1], 2.5, "panned y = (3 + 2) * 0.5");
	});

	test("(m) validNamespace accepts [a-z0-9_.-]+ only (design §15.6)", function () {
		ok(VFXIR.validNamespace("vfx_demos"), "lowercase + underscore");
		ok(VFXIR.validNamespace("my.pack-1"), "dot and dash allowed");
		ok(VFXIR.validNamespace("a"), "single char");
		ok(!VFXIR.validNamespace(""), "empty rejected");
		ok(!VFXIR.validNamespace("VFX"), "uppercase rejected");
		ok(!VFXIR.validNamespace("has space"), "space rejected");
		ok(!VFXIR.validNamespace("../evil"), "path traversal rejected");
		ok(!VFXIR.validNamespace(null), "null rejected");
		ok(!VFXIR.validNamespace(7), "non-string rejected");
	});

	test("(n) exportZipBody matches the bridge's POST /export/zip shape", function () {
		var body = VFXIR.exportZipBody("vfx_demos", { spark: "{}" }, { version: 1 });
		eq(body.namespace, "vfx_demos", "namespace");
		eq(body.effects.spark, "{}", "effects carried verbatim");
		eq(body.sidecar.version, 1, "sidecar carried");
		ok(!("destination" in body), "a zip body has no destination");
		ok(!("path" in body), "a zip body has no path");
		// A null sidecar is omitted, not serialised as null.
		var bare = VFXIR.exportZipBody("ns", {});
		ok(!("sidecar" in bare), "absent sidecar is omitted");
	});

	test("(o) exportTargetBody carries destination + path for folder/world", function () {
		var folder = VFXIR.exportTargetBody("ns", "folder", "C:\\packs\\ns", { blur: "{}" }, null);
		eq(folder.destination, "folder", "folder destination");
		eq(folder.path, "C:\\packs\\ns", "folder path");
		eq(folder.namespace, "ns", "namespace");
		ok(!("sidecar" in folder), "null sidecar omitted");
		var world = VFXIR.exportTargetBody("ns", "world", "C:/saves/New World", { blur: "{}" }, { tabs: [] });
		eq(world.destination, "world", "world destination");
		ok(world.sidecar != null, "sidecar included when present");
	});

	test("(o2) datapackPath builds <root>/<world>/datapacks/<pack>", function () {
		eq(VFXIR.datapackPath("C:/saves", "New World", "vfx_demos"),
				"C:/saves/New World/datapacks/vfx_demos", "path built");
		eq(VFXIR.datapackPath("C:\\saves\\", "New World", "vfx_demos.zip"),
				"C:\\saves/New World/datapacks/vfx_demos.zip", "trailing separator trimmed");
		eq(VFXIR.datapackPath("", "W", "p"), "", "missing root");
		eq(VFXIR.datapackPath("C:/saves", "", "p"), "", "missing world");
		eq(VFXIR.datapackPath("C:/saves", "W", ""), "", "missing pack");
	});

	test("(p) timing is always explicit; preview overrides loop + fade_ticks", function () {
		var tab = new VFXIR.Tab("blur", "blur");
		var def = parse(compileTab(tab));
		eq(def.duration, 40, "duration explicit");
		eq(def.loop, false, "loop explicit");
		eq(def.persistent, false, "persistent explicit");
		eq(def.fade_ticks, 0, "fade_ticks default explicit");
		tab.loop = true;
		tab.persistent = true;
		tab.fade_ticks = 7;
		var authored = parse(compileTab(tab));
		eq(authored.loop, true, "authored loop kept");
		eq(authored.fade_ticks, 7, "authored fade kept");
		var preview = parse(window.VFXCompiler.compileForPreview(tab));
		eq(preview.loop, true, "preview loops");
		eq(preview.fade_ticks, 0, "preview fade forced to 0");
		eq(preview.persistent, true, "preview keeps the authored persistent flag");
		eq(preview.duration, 40, "preview keeps the authored duration (no sentinel)");
	});

	test("(I1) a slot with >=1 key serializes ONLY as keyframes", function () {
		var tab = new VFXIR.Tab("blur", "blur");
		// A stale animate marker must not win over the keys: fade/start-end never emulates an animation.
		tab.params.radius = VFXIR.ParamSpec.animate(0, 1);
		tab.addKey("radius", 0, 0);
		tab.addKey("radius", 20, 1);
		var def = parse(compileTab(tab));
		ok(Array.isArray(def.params.radius.keyframes), "keyframes present");
		eq(def.params.radius.keyframes.length, 2, "keyframe count");
		ok(!("start" in def.params.radius), "no start emulation");
		ok(!("end" in def.params.radius), "no end emulation");
		ok(!("fade_ticks" in def.params.radius), "fade_ticks never animates a slot");
	});

	test("(I2) fade_ticks only ever the effect-level setting", function () {
		var tab = new VFXIR.Tab("blur", "blur");
		tab.fade_ticks = 12;
		tab.params.radius = VFXIR.ParamSpec.keyframes();
		tab.addKey("radius", 0, 0);
		tab.addKey("radius", 40, 1);
		var def = parse(compileTab(tab));
		eq(def.fade_ticks, 12, "fade_ticks on the effect");
		ok(!("fade_ticks" in def.params.radius), "fade_ticks not on a param");
		ok(Array.isArray(def.params.radius.keyframes), "true keys, not a fade-emulated animation");
	});

	test("(I3) keyframe times clamp to [0, duration] and warn", function () {
		var tab = new VFXIR.Tab("blur", "blur");
		tab.duration = 40;
		tab.params.radius = VFXIR.ParamSpec.keyframes();
		tab.addKey("radius", -10, 0);
		tab.addKey("radius", 80, 1);
		var def = parse(compileTab(tab));
		eq(def.params.radius.keyframes[0].time, 0, "negative clamps to 0");
		eq(def.params.radius.keyframes[1].time, 40, "past the end clamps to duration");
		var warnings = window.VFXCompiler.getWarnings();
		eq(warnings.length, 2, "both clamps collected");
		eq(warnings[0].param, "radius", "warning names the param");
		eq(warnings[0].clamped, 0, "first clamp target");
		eq(warnings[1].clamped, 40, "second clamp target");
	});

	test("(q) compiler folds a bind driver into a param (design §15.8)", function () {
		var tab = new VFXIR.Tab("blur", "blur");
		tab.valueNodes = [ { id: "b1", kind: "bind", inputs: { bind: "health" } } ];
		tab.edges = [ { from: "b1", to: "radius" } ];
		var def = parse(compileTab(tab));
		eq(def.params.radius.bind, "health", "bind folded onto the param");
		ok(!("graph" in def), "the folded node leaves no graph block");
		ok(!("inputs" in def), "the folded node leaves no inputs block");
	});

	test("(r) compiler folds an expr driver into a param (design §15.8)", function () {
		var tab = new VFXIR.Tab("blur", "blur");
		tab.valueNodes = [ { id: "e1", kind: "expr", inputs: { expr: "sin(t*0.1)" } } ];
		tab.edges = [ { from: "e1", to: "radius" } ];
		var def = parse(compileTab(tab));
		eq(def.params.radius.expr, "sin(t*0.1)", "expr folded onto the param");
		ok(!("graph" in def), "no graph block after folding");
	});

	test("(s) fold guard: a fallback bind stays a graph node", function () {
		// A fallback cannot ride a param-bind spec, so folding would drop it; the node must stay.
		var tab = new VFXIR.Tab("blur", "blur");
		tab.valueNodes = [ { id: "b1", kind: "bind", inputs: { bind: "health", fallback: 0.5 } } ];
		tab.edges = [ { from: "b1", to: "radius" } ];
		var def = parse(compileTab(tab));
		ok(def.graph && def.graph.nodes.length === 1, "fallback bind stays in the graph");
		eq(def.inputs.radius.from, "b1", "the driver stays an inputs wire");
		ok(!(def.params.radius && def.params.radius.bind), "no folded bind spec");
	});

	test("(t) multiply layers on a value and survives a track", function () {
		var tab = new VFXIR.Tab("blur", "blur");
		tab.params.radius = { value: 0, multiply: { bind: "proximity", pos: [0, 0, 0] } };
		var def = parse(compileTab(tab));
		eq(def.params.radius.value, 0, "value kept");
		eq(def.params.radius.multiply.bind, "proximity", "multiply layered");
		tab.params.radius = { multiply: { bind: "proximity" } };
		tab.addKey("radius", 0, 0);
		tab.addKey("radius", 10, 1);
		var track = parse(compileTab(tab));
		ok(Array.isArray(track.params.radius.keyframes), "track form wins");
		eq(track.params.radius.multiply.bind, "proximity", "multiply survives the track form");
	});

	test("(u) normalizeParam maps every datapack form back to a slot (design §15.8)", function () {
		var track = VFXIR.normalizeParam(
				{ keyframes: [{ time: 0, value: 1 }, { time: 5, value: 2 }], multiply: { bind: "health" } }, 40);
		eq(track.state, "track", "keyframes -> track");
		eq(track.keys.length, 2, "keys carried");
		eq(track.keys[1].value, 2, "key value carried");
		eq(track.spec.multiply.bind, "health", "multiply carried on the spec");
		var drivenBind = VFXIR.normalizeParam({ bind: "look", range: 30 }, 40);
		eq(drivenBind.state, "driven", "bind -> driven");
		eq(drivenBind.driver.kind, "bind", "bind driver kind");
		eq(drivenBind.driver.inputs.bind, "look", "bind driver inputs");
		var drivenExpr = VFXIR.normalizeParam({ expr: "t*2" }, 40);
		eq(drivenExpr.state, "driven", "expr -> driven");
		eq(drivenExpr.driver.inputs.expr, "t*2", "expr source");
		var inline = VFXIR.normalizeParam({ value: 3 }, 40);
		eq(inline.state, "inline", "value -> inline");
		eq(inline.spec.value, 3, "inline value");
		var literal = VFXIR.normalizeParam(7, 40);
		eq(literal.state, "inline", "number -> inline");
		eq(literal.spec.value, 7, "number value");
		var anim = VFXIR.normalizeParam({ start: 1, end: 4 }, 40);
		eq(anim.state, "track", "start/end -> a two-key track");
		eq(anim.keys[0].value, 1, "start key at 0");
		eq(anim.keys[1].time, 40, "end key at the duration");
		eq(anim.keys[1].value, 4, "end key value");
	});

	test("(v) a constant driver folds to a plain value (design §15.8)", function () {
		var tab = new VFXIR.Tab("blur", "blur");
		tab.valueNodes = [ { id: "c1", kind: "constant", inputs: { value: 3.5 } } ];
		tab.edges = [ { from: "c1", to: "radius" } ];
		var def = parse(compileTab(tab));
		eq(def.params.radius, 3.5, "constant node folds to a bare value");
		ok(!("graph" in def), "no graph block after folding");
	});

	test("(w) vector group: a group constant expands to three scalars; an override wins", function () {
		var params = [
			{ name: "color_r", vectorGroup: "color", vectorIndex: 0, defaultValue: 1 },
			{ name: "color_g", vectorGroup: "color", vectorIndex: 1, defaultValue: 1 },
			{ name: "color_b", vectorGroup: "color", vectorIndex: 2, defaultValue: 1 }
		];
		var rows = VFXIR.paramGroups(params);
		eq(rows.length, 1, "three grouped params collapse to one row");
		eq(rows[0].group, "color", "the row is keyed by the group");
		eq(rows[0].components.length, 3, "three components on the row");

	test("(VFX2) source form emits {bind:<source>,derive:<kind>} and prunes fields per kind", function () {
		window.VFXEditor = window.VFXEditor || {};
		window.VFXEditor.schema = window.VFXEditor.schema || {};
		window.VFXEditor.schema.bind = window.VFXEditor.schema.bind || {
			kinds: [
				{ id: "screen_x", needsPos: true, requiresObjective: false, fields: ["scale"] },
				{ id: "scoreboard", needsPos: false, requiresObjective: true,
					fields: ["holder", "range", "invert", "scale"] },
				{ id: "look", needsPos: false, requiresObjective: false,
					fields: ["yaw", "pitch", "range", "invert", "scale"] },
				{ id: "health", needsPos: false, requiresObjective: false, fields: ["invert", "scale"] }
			],
			sources: ["camera", "player", "entity", "point", "block"]
		};
		// Literal anchor: a needsPos kind gets its `pos`.
		eq(JSON.stringify(VFXIR.buildBindSpec("screen_x", "", { pos: [1, 2, 3] })),
				JSON.stringify({ bind: "screen_x", pos: [1, 2, 3] }), "literal screen_x keeps pos");
		// player/camera source: no pos, the source provides the anchor.
		eq(JSON.stringify(VFXIR.buildBindSpec("screen_x", "player", { pos: [9, 9, 9] })),
				JSON.stringify({ bind: "player", derive: "screen_x" }), "player source drops pos");
		// point/block source: pos is the source anchor.
		eq(JSON.stringify(VFXIR.buildBindSpec("screen_x", "point", { pos: [4, 5, 6] })),
				JSON.stringify({ bind: "point", derive: "screen_x", pos: [4, 5, 6] }), "point source pos");
		// scoreboard: objective + holder + range.
		eq(JSON.stringify(VFXIR.buildBindSpec("scoreboard", "", { objective: "obj", holder: "@a", range: 8 })),
				JSON.stringify({ bind: "scoreboard", objective: "obj", holder: "@a", range: 8 }),
				"scoreboard fields");
		// look: yaw/pitch/range/invert/scale only.
		eq(JSON.stringify(VFXIR.buildBindSpec("look", "",
				{ yaw: 10, pitch: 20, range: 30, invert: true, scale: 2, holder: "x" })),
				JSON.stringify({ bind: "look", yaw: 10, pitch: 20, range: 30, invert: true, scale: 2 }),
				"look prunes holder and keeps yaw/pitch");
		// entity source: selector + point + offset.
		eq(JSON.stringify(VFXIR.buildBindSpec("screen_y", "entity",
				{ selector: "@p", point: "eyes", offset: [0, 1, 0] })),
				JSON.stringify({ bind: "entity", derive: "screen_y", selector: "@p", point: "eyes",
					offset: [0, 1, 0] }), "entity source");
		// setBindSource / setBindKind keep bind = source + derive = kind.
		var spec = { bind: "screen_x", pos: [1, 2, 3] };
		VFXIR.setBindSource(spec, "player");
		eq(spec.bind, "player", "bind becomes the source");
		eq(spec.derive, "screen_x", "derive keeps the kind");
		eq(spec.pos, undefined, "player source drops pos");
		VFXIR.setBindKind(spec, "proximity");
		eq(spec.bind, "player", "source survives a kind change");
		eq(spec.derive, "proximity", "derive becomes the new kind");
		VFXIR.setBindSource(spec, "");
		eq(spec.bind, "proximity", "removing the source restores the kind");
		eq(spec.derive, undefined, "no derive without a source");
		ok(Array.isArray(spec.pos), "a needsPos kind gets a default pos");
	});

	test("(MP1) a 200-definition pack opens lazily, not one tab per definition", function () {
		var effects = {};
		for (var i = 0; i < 200; i++) {
			effects["effect_" + i] = JSON.stringify({ type: "blur", duration: 20, params: { radius: 1 } });
		}
		var started = Date.now();
		var index = VFXIR.buildPackIndex("demo", effects);
		eq(index.count, 200, "indexed every definition");
		ok(VFXIR.packIsLazy(index), "a 200-effect pack is lazy");
		var created = 0;
		var commits = 0;
		var plan = VFXIR.openPackPlan(index, {
			suspend: function () {},
			resume: function () {},
			createTab: function () { created++; return {}; },
			hydrate: function () {},
			materialize: function () {},
			select: function () {},
			commit: function () { commits++; }
		}, {});
		eq(plan.lazy, true, "large pack returns a lazy plan");
		eq(created, 0, "no tab materialised per definition");
		eq(commits, 0, "no snapshot taken on a lazy open");
		// On the old path every one of the 200 tabs took a snapshot: sum(1..200) = 20100 tab clones.
		// The new open does zero, so this plus the timing guard fails the old O(N^2) fan-out.
		ok(Date.now() - started < 1000, "lazy open is cheap (was O(N^2))");
	});

		var drawn = {};
		drawn[VFXIR.edgeKey({ from: "a", to: "radius" })] = true;
		var dropped = VFXIR.mergeEdges([{ from: "a", to: "radius" }], [], drawn, owner, keep);
		eq(dropped.length, 0, "a drawn-then-disconnected wire stays deleted");
	});

	test("(M2) mergeEdges dedupes canvas wires, drops rewired targets and invalid endpoints", function () {
		var owner = function () { return "fx"; };
		var dup = VFXIR.mergeEdges([{ from: "a", to: "radius" }], [{ from: "a", to: "radius" }],
				{}, owner, function () { return true; });
		eq(dup.length, 1, "a drawn wire is not duplicated");
		var rewired = VFXIR.mergeEdges([{ from: "a", to: "radius" }], [{ from: "b", to: "radius" }],
				{}, owner, function () { return true; });
		eq(rewired.length, 1, "a rewired param keeps one wire");
		eq(rewired[0].from, "b", "the canvas wire wins");
		var invalid = VFXIR.mergeEdges([{ from: "gone", to: "radius" }], [],
				{}, owner, function () { return false; });
		eq(invalid.length, 0, "a vanished endpoint stays deleted");
	});

	test("(M3) edgeKey is key-order independent; node wires address their own slots", function () {
		eq(VFXIR.edgeKey({ from: "a", to: "b" }), VFXIR.edgeKey({ to: "b", from: "a" }),
				"key order must not matter");
		var owner = function () { return null; };
		var merged = VFXIR.mergeEdges([{ from: "a", to: "b", input: "x" }],
				[{ from: "a", to: "radius" }], {}, owner, function () { return true; });
		eq(merged.length, 2, "a node wire and a param wire are different slots");
	});

	test("(D1) formatDiag reports counts and OK when clean", function () {
		ok(window.VFXInspector && typeof window.VFXInspector.formatDiag === "function",
				"VFXInspector.formatDiag loaded");
		var text = window.VFXInspector.formatDiag({ name: "blur", type: "blur", effects: 1,
			edges: [{ from: "n1", to: "radius", output: "amount" }],
			canvasNodes: 3, canvasLinks: 2, valueNodes: 2, fieldKeys: ["intensity"],
			instanceIds: ["n1"], sections: 2, schemaGroups: 2, anomalies: [] });
		ok(text.indexOf("tab: blur (type: blur, effects: 1)") === 0, "tab line first");
		ok(text.indexOf("ir edges: 1") >= 0, "edge count");
		ok(text.indexOf("n1 -> radius") >= 0, "edge listed");
		ok(text.indexOf("instances: [n1]") >= 0, "instances listed");
		ok(text.indexOf("inspector sections: 2 (schema groups: 2)") >= 0, "sections line");
		ok(text.indexOf("OK: no anomalies") >= 0, "clean verdict");
	});

	test("(D2) formatDiag renders one ANOMALY line per anomaly", function () {
		var text = window.VFXInspector.formatDiag({ name: "t", type: "dent", effects: 1, edges: [],
			canvasNodes: 1, canvasLinks: 0, valueNodes: 0, fieldKeys: [], instanceIds: [],
			sections: 1, schemaGroups: 3,
			anomalies: ["IR edge n1 -> radius has no canvas link",
				"params have 3 schema groups but 1 rendered section"] });
		eq(text.split("ANOMALY: ").length - 1, 2, "two anomaly lines");
		ok(text.indexOf("OK:") < 0, "no clean verdict alongside anomalies");
	});

	return results;
};
/* SELFTEST:END */
</script>

<script>
(function () {
	"use strict";

	var token = "";
	try {
		var m = /[?&]token=([^&]+)/.exec(window.location.search);
		token = m ? decodeURIComponent(m[1]) : "";
	} catch (e) {
		token = "";
	}
	var query = token ? "?token=" + encodeURIComponent(token) : "";

	function load(source, done) {
		var script = document.createElement("script");
		script.src = source + query;
		script.onload = done;
		script.onerror = done;
		document.body.appendChild(script);
	}

	function render() {
		var out = document.getElementById("vfx-selftest-out");
		var results;
		try {
			results = window.__vfxSelftest();
		} catch (e) {
			out.textContent = "HARNESS ERROR: " + e;
			return;
		}
		var passed = 0;
		var lines = results.map(function (result) {
			if (result.ok) {
				passed++;
				return "PASS  " + result.name;
			}
			return "FAIL  " + result.name + "  — " + result.error;
		});
		lines.push("");
		lines.push(passed + "/" + results.length + " passed");
		out.textContent = lines.join("\n");
		out.className = passed === results.length ? "pass" : "fail";
	}

	load("ir.js", function () {
		load("compiler.js", render);
	});
})();
</script>
