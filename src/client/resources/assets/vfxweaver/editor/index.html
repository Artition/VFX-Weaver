<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VFXweaver Editor</title>
<!--
  Every request (static assets included) is gated on the bridge token, which is
  passed on the page URL (`/?token=...`). Static link/script tags cannot send it,
  so this small bootstrap reads the token and injects the asset tags with the
  token appended. Nothing else lives here.

  Assets are served under `/assets/` (EditorServer serves only `/` and
  `/assets/*`), so every asset path below is prefixed with `assets/`.
-->
<script>
(function () {
	"use strict";
	var ASSET_ROOT = "assets/";
	var token = "";
	try {
		var m = /[?&]token=([^&]+)/.exec(location.search);
		token = m ? decodeURIComponent(m[1]) : "";
	} catch (e) {
		token = "";
	}
	window.VFX_TOKEN = token;
	var q = token ? "?token=" + encodeURIComponent(token) : "";

	function loadCss(href) {
		var link = document.createElement("link");
		link.rel = "stylesheet";
		link.href = href;
		document.head.appendChild(link);
	}

	function loadJs(src, done) {
		var script = document.createElement("script");
		script.src = src;
		// app.js must run after litegraph.js, and the "unsupported browser" banner
		// must still run if litegraph.js failed, so both onload and onerror chain.
		script.onload = done;
		script.onerror = done;
		document.body.appendChild(script);
	}

	loadCss(ASSET_ROOT + "litegraph.css" + q);
	loadCss(ASSET_ROOT + "editor.css" + q);
	document.addEventListener("DOMContentLoaded", function () {
		loadJs(ASSET_ROOT + "litegraph.js" + q, function () {
			// bridge.js owns window.VFXBridge and must exist before app.js boots and connects.
			// app.js owns window.VFXEditor; ir.js/compiler.js/inspector.js/timeline.js load after it
			// and merge onto it (VFXEditor.ir / .compiler / .inspector / .timeline) instead of being
			// clobbered.
			loadJs(ASSET_ROOT + "bridge.js" + q, function () {
				loadJs(ASSET_ROOT + "app.js" + q, function () {
					loadJs(ASSET_ROOT + "ir.js" + q, function () {
						loadJs(ASSET_ROOT + "compiler.js" + q, function () {
							loadJs(ASSET_ROOT + "inspector.js" + q, function () {
								loadJs(ASSET_ROOT + "timeline.js" + q);
							});
						});
					});
				});
			});
		});
	});
})();
</script>
</head>
<body>
<div id="vfx-banner" role="alert" hidden></div>
<header id="vfx-topbar">
	<button id="vfx-file" type="button" class="vfx-menubtn" aria-haspopup="true" aria-expanded="false">File</button>
	<button id="vfx-project" type="button" class="vfx-project-btn" title="Project settings (name, namespace, defaults)">
		<span id="vfx-project-name">Untitled project</span>
		<span id="vfx-project-ns" class="vfx-project-ns"></span>
	</button>
	<span class="vfx-sep" aria-hidden="true"></span>
	<nav id="vfx-tabs" role="tablist" aria-label="Effect tabs"></nav>
	<button id="vfx-new-tab" type="button" title="New effect tab">+</button>
	<label class="vfx-tab-field" title="Active tab name">Tab
		<input id="vfx-tab-name" type="text" placeholder="effect name" aria-label="Active tab name">
	</label>
	<div id="vfx-transport" role="group" aria-label="Transport">
		<button id="vfx-play" type="button" title="Play / pause (Space)">▶</button>
		<button id="vfx-stop" type="button" title="Stop">■</button>
		<button id="vfx-replay" type="button" title="Replay from the start (R)">⟳</button>
	</div>
	<span id="vfx-revbadge" class="vfx-badge" aria-live="polite"></span>
	<span id="vfx-status" aria-live="polite"></span>
</header>
<main id="vfx-main">
	<aside id="vfx-palette" aria-label="Schema palette">
		<input id="vfx-filter" type="search" placeholder="Filter nodes..." aria-label="Filter nodes">
		<div class="vfx-pal-scroll">
			<h2>Effects</h2>
			<div id="vfx-types"></div>
			<h2>Value nodes</h2>
			<div id="vfx-value-types"></div>
		</div>
	</aside>
	<section id="vfx-canvas-wrap">
		<canvas id="vfx-canvas"></canvas>
	</section>
	<aside id="vfx-inspector" aria-label="Inspector"></aside>
</main>
<footer id="vfx-timeline" aria-label="Timeline"></footer>
</body>
</html>
