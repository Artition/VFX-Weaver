# Version selector in the header, driven by mike (see .github/workflows/docs.yml).
# `mike` writes each deployed version to the gh-pages branch and a versions.json the
# selector reads; `default: latest` opens the newest version, `alias: true` shows the
# `latest` alias next to the version in the dropdown.
extra:
  version:
    provider: mike
    default: latest
    alias: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 4
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.smartsymbols
